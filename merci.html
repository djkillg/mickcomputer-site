<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci ! – Mick Computer</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#1875bb;--cyan-dark:#125e96;--ink:#0a0e14;--grey:#5b6573;--bg-soft:#f6f8fa;--line:#e7eaef}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg-soft);color:var(--ink);min-height:100vh;
    display:grid;place-items:center;padding:24px;text-align:center}
  .card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:54px 40px;max-width:480px;
    box-shadow:0 10px 40px rgba(10,14,20,.08)}
  .badge{width:84px;height:84px;border-radius:50%;background:rgba(24,117,187,.12);color:var(--cyan);
    display:grid;place-items:center;font-size:2.4rem;margin:0 auto 24px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;margin-bottom:12px;letter-spacing:-.02em}
  p{color:var(--grey);font-size:1.05rem;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--cyan);color:#fff;font-family:'Space Grotesk';
    font-weight:600;padding:14px 28px;border-radius:50px;text-decoration:none;transition:.25s;
    box-shadow:0 10px 30px rgba(24,117,187,.28)}
  .btn:hover{background:var(--cyan-dark);transform:translateY(-2px)}
  .tel{display:block;margin-top:20px;color:var(--grey);font-size:.95rem;text-decoration:none}
  .tel b{color:var(--ink);font-family:'Space Grotesk'}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">&#10003;</div>
    <h1>Demande bien reçue&nbsp;!</h1>
    <p>Merci de votre confiance. Mick vous recontacte très rapidement avec un devis gratuit.</p>
    <a href="index.html" class="btn">&larr; Retour au site</a>
    <a href="tel:+32475621439" class="tel">Une urgence ? <b>0475 62 14 39</b></a>
  </div>
<script src="suivi.js" defer></script>
</body>
</html>
